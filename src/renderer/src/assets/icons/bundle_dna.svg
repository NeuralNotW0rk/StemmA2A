<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Directly scaled individual DNA strand geometry -->
    <g id="dna-strand">
      <path d="M-4.5 -10c0 5 9 5 9 10s-9 5-9 10" />
      <path d="M4.5 -10c0 5-9 5-9 10s9 5 9 10" />
      <line x1="-4" y1="-8.5" x2="4" y2="-8.5" />
      <line x1="-2.5" y1="-6.5" x2="2.5" y2="-6.5" />
      <line x1="-1.8" y1="-3" x2="1.8" y2="-3" />
      <line x1="-4.5" y1="0" x2="4.5" y2="0" />
      <line x1="-1.8" y1="3" x2="1.8" y2="3" />
      <line x1="-2.5" y1="6.5" x2="2.5" y2="6.5" />
      <line x1="-4" y1="8.5" x2="4" y2="8.5" />
    </g>
  </defs>

  <!-- 3 stacked copies of the individual DNA sub-icon -->
  <!-- Copy 1: Back (Top-Left) -->
  <use href="#dna-strand" xlink:href="#dna-strand" transform="translate(7.5, 7.5) scale(0.65)" opacity="0.45" />

  <!-- Copy 2: Middle -->
  <use href="#dna-strand" xlink:href="#dna-strand" transform="translate(12, 12) scale(0.65)" opacity="0.75" />

  <!-- Copy 3: Front (Bottom-Right) -->
  <use href="#dna-strand" xlink:href="#dna-strand" transform="translate(16.5, 16.5) scale(0.65)" opacity="1" />
</svg>
